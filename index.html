<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#6ec6ff" />
  <meta name="description" content="Mr. Capy — a Mario-style platformer starring a capybara. Plays on phone, tablet and desktop." />
  <title>Mr. Capy</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Sky-toned gradient so the FIT letterbox bars blend with the game's
         own sky instead of showing a dark dead zone on tall/wide screens. */
      background: linear-gradient(180deg, #6ec6ff 0%, #9ad9ff 55%, #bfe9ff 100%);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    /* The game fills the entire viewport on every device; Phaser's FIT scale
       keeps the 4:3 play area centered and crisp, auto-resizing on rotate. */
    #game {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* avoids mobile URL-bar jump where supported */
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game canvas { display: block; touch-action: none; }
    /* Lightweight pre-boot loader shown until Phaser mounts. */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #0d2b45;
      font-size: 20px;
      letter-spacing: 1px;
      transition: opacity 0.4s ease;
    }
    #loader .capy { font-size: 56px; animation: bob 1s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    #loader.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="loader"><div class="capy">🦫</div><div>Loading Mr.&nbsp;Capy…</div></div>
  <script type="module" src="/src/game.ts"></script>
</body>
</html>
