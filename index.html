<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#6ec6ff" />
  <meta name="description" content="Mr. Capy — a Mario-style platformer starring a capybara. Plays on phone, tablet and desktop." />
  <title>Mr. Capy</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #6ec6ff 0%, #9ad9ff 55%, #bfe9ff 100%);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    /* Vertical stack: the game scenario on top, control bar underneath. */
    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }
    #game {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game canvas { display: block; touch-action: none; }

    /* Control bar sits BELOW the canvas (hidden by default; shown on touch). */
    #controls {
      flex: 0 0 auto;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px max(16px, env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom));
      background: rgba(13, 43, 69, 0.92);
      border-top: 2px solid rgba(255, 255, 255, 0.15);
      user-select: none;
    }
    #controls .group { display: flex; gap: 12px; }
    .btn {
      width: 76px;
      height: 76px;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 34px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      transition: transform 0.05s ease, background 0.1s ease;
    }
    .btn.jump {
      width: 96px;
      background: rgba(105, 240, 174, 0.18);
      border-color: rgba(105, 240, 174, 0.5);
    }
    .btn.active { background: rgba(255, 255, 255, 0.32); transform: scale(0.94); }

    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #0d2b45;
      font-size: 20px;
      letter-spacing: 1px;
      transition: opacity 0.4s ease;
    }
    #loader .capy { font-size: 56px; animation: bob 1s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    #loader.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="app">
    <div id="game"></div>
    <div id="controls">
      <div class="group">
        <div class="btn" id="btn-left" aria-label="Move left">◀</div>
        <div class="btn" id="btn-right" aria-label="Move right">▶</div>
      </div>
      <div class="group">
        <div class="btn jump" id="btn-jump" aria-label="Jump">⤒</div>
      </div>
    </div>
  </div>
  <a id="to3d" href="./3d.html">🧊 3D World</a>
  <div id="loader"><div class="capy">🦫</div><div>Loading Mr.&nbsp;Capy…</div></div>
  <script type="module" src="/src/game.ts"></script>
  <style>
    #to3d {
      position: fixed; top: 10px; right: 10px; z-index: 6;
      background: rgba(13,43,69,0.85); color: #fff; text-decoration: none;
      padding: 8px 12px; border-radius: 10px; font-size: 14px;
      border: 1px solid rgba(255,255,255,0.3);
    }
    #to3d:hover { background: rgba(13,43,69,1); }
  </style>
</body>
</html>
