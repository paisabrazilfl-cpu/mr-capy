<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#8fd0ff" />
  <title>Mr. Capy 3D</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd0ff; font-family: ui-monospace, monospace; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }
    #hint {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      background: rgba(13,43,69,0.8); color: #fff; padding: 8px 16px; border-radius: 10px;
      font-size: 14px; pointer-events: none; z-index: 5;
    }
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; color: #0d2b45; font-size: 20px; transition: opacity .4s;
    }
    #loader .capy { font-size: 56px; animation: bob 1s ease-in-out infinite; }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    #loader.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hint">WASD / Arrows to move &nbsp;•&nbsp; drag to look around</div>
  <div id="loader"><div class="capy">🦫</div><div>Building world…</div></div>
  <script type="module" src="/src/voxel/main.ts"></script>
</body>
</html>
