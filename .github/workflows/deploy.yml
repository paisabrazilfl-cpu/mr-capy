name: Deploy to Render

# Triggers a Render deploy after code lands on main.
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   RENDER_API_KEY     — a Render API key (rotate if ever exposed)
#   RENDER_SERVICE_ID  — the target service id, e.g. srv-xxxxxxxx
# No secrets are ever hard-coded in source.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Guard — required secrets must be present
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::error::RENDER_API_KEY and/or RENDER_SERVICE_ID are not set."
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Secrets present; proceeding to deploy."

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          echo "Requesting deploy for service $RENDER_SERVICE_ID ..."
          response=$(curl -fsS -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}')
          echo "$response"
          deploy_id=$(echo "$response" | sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1)
          if [ -z "$deploy_id" ]; then
            echo "::error::Render did not return a deploy id."
            exit 1
          fi
          echo "Render deploy created: $deploy_id"
